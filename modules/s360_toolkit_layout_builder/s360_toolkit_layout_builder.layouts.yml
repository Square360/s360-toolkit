s360_toolkit_layout_builder_onecol_section:
  label: 'One Column'
  path: layout/onecol
  template: layout--onecol-section
  class: '\Drupal\s360_toolkit_layout_builder\Plugin\Layout\OneColumnLayout'
  category: 'Columns: 1'
  default_region: content
  icon_map:
    - [content]
  regions:
    content:
      label: Content

s360_toolkit_layout_builder_twocol_section:
  label: 'Two Column'
  path: layout/twocol
  template: layout--twocol-section
  class: '\Drupal\s360_toolkit_layout_builder\Plugin\Layout\TwoColumnLayout'
  category: 'Columns: 2'
  default_region: first
  icon_map:
    - [first, second]
  regions:
    first:
      label: First
    second:
      label: Second

s360_toolkit_layout_builder_threecol_section:
  label: 'Three Column'
  path: layout/threecol
  template: layout--threecol-section
  class: '\Drupal\s360_toolkit_layout_builder\Plugin\Layout\ThreeColumnLayout'
  category: 'Columns: 3'
  default_region: first
  icon_map:
    - [first, second, third]
  regions:
    first:
      label: First
    second:
      label: Second
    third:
      label: Third

s360_toolkit_layout_builder_fourcol_section:
  label: 'Four Column'
  path: layout/fourcol
  template: layout--fourcol-section
  category: 'Columns: 4'
  default_region: first
  icon_map:
    - [first, second, third, fourth]
  regions:
    first:
      label: First
    second:
      label: Second
    third:
      label: Third
    fourth:
      label: Fourth
